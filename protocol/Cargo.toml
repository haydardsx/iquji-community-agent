[package]
name = "iquji-community-agent-wire"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = ["crates-io"]
license = "MIT"
description = "Rust types and validation for agent requests, events and process supervision."
repository = "https://github.com/haydardsx/iquji-community-agent"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "LICENSE", "config.example.json", "rust-toolchain.toml"]

[lib]
name = "iquji_agent_wire"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
url = "=2.5.8"

[lints.rust]
unsafe_code = "forbid"
