[package]
name = "iquji-shared-agent"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
publish = ["crates-io"]
license = "MIT"
description = "连接本机已授权 Agent 的 Rust 库与命令行工具。"
repository = "https://github.com/haydardsx/iquji-community-agent"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "README.en.md", "LICENSE", "config.example.json", "rust-toolchain.toml"]

[dependencies]
iquji-agent-wire = { version = "0.1.2", path = "protocol" }
agent-client-protocol = "=3.3.0"
async-io = "=2.6.0"
futures = "=0.3.33"
tracing = "=0.1.44"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
base64 = "=0.23.1"
toml = { version = "=1.1.4", default-features = false, features = ["display", "parse", "std", "serde"] }
serde_yaml_ng = "=0.10.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
members = [".", "protocol"]
exclude = ["protocol/tests/fixtures/host"]
resolver = "3"
