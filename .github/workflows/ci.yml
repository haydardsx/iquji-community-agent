name: Community Agent CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pull request commit identities
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_maintainer.py
      - name: 检查用途分支和提交标题
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_subjects.py --pull-request
      - name: 检查源码、测试和制品
        shell: bash
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          bash -euo pipefail > /dev/null 2>&1 <<'CHECK' || { echo 'Source, test or package verification failed.'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
            python3 .github/scripts/community_guard.py --repo . --tree "$SOURCE" --history
          fi
          python3 scripts/check.py
          CHECK
  result:
    name: community-ci
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 核对 Linux 验收结果
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
